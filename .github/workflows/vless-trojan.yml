name: Simple VLESS Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate VLESS config
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "vless://$UUID@example.com:443?security=tls&host=example.com#SimpleVLESS" > config.txt
          cat config.txt
          
      - name: Show result
        run: |
          echo "=== YOUR VLESS CONFIG ==="
          cat config.txt
          echo "========================="
